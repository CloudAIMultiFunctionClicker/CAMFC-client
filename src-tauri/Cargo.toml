[package]
name = "camfc-client"
version = "0.1.0"
description = "云笔 - 智能翻页笔客户端"
authors = ["you"]
edition = "2021"

[lib]
name = "camfc_client_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
btleplug = "^0.11"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
futures = "0.3"
windows = { version = "0.58", features = [
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "UI_Notifications",
    "Data_Xml_Dom",
] }
uuid = "1.19.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
tempfile = "3.10"
anyhow = "1.0"
bytes = "1.7"
urlencoding = "2.1"
rfd = "0.14"
dotenv = "0.15"
dirs = "5"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
xcap = "0.4"
base64 = "0.22"
tracing-subscriber = { version = "0.3", features = ["chrono"] }
tracing = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
regex = "1.10"
screenshots = "0.8"
enigo = "0.1"
arboard = "3.3"
winapi = { version = "0.3", features = ["winuser", "libloaderapi"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[profile.dev]
incremental = true
