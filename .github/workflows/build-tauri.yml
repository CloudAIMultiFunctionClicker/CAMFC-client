name: 构建并发布 Tauri Windows 独立 exe

# 每次推送 tag 时触发,自动构建独立 exe 并发布对应的 GitHub Release
on:
  push:
    tags:
      - 'v*'
      - '*.*.*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 构建 Tauri 独立 exe
        run: pnpm tauri build --no-bundle

      - name: 发布 Release 并上传 exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Release ${{ github.ref_name }}'
          body: '自动生成的 Windows 独立 exe，解压即用。'
          files: |
            src-tauri/target/release/camfc-client.exe
            src-tauri/target/release/云笔 - 智能翻页笔客户端.exe
          generate_release_notes: true